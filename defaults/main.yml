---
# role: git
# file: defaults/main.yml

# Enable the platform credential helper on Debian.
git_keyring_enabled: true

# Managed system settings; string values set keys and null removes them.
git_system_config:
  core.excludesfile: ~/.gitignore
  core.autocrlf: input
  core.whitespace: trailing-space,space-before-tab,tab-in-indent,cr-at-eol
  color.branch: auto
  color.diff: auto
  color.interactive: auto
  color.status: auto
  push.default: simple
  alias.a: add .
  alias.c: commit
  alias.ca: commit -a
  alias.cm: commit -m
  alias.cam: commit -am
  alias.d: diff
  alias.dc: diff --cached
  alias.l: log --graph --pretty=format:"%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset" --abbrev-commit
  alias.p: push
# Example: git_system_config: {core.editor: vi, init.defaultBranch: main}

# Suppress global configuration output when accounts contain sensitive settings.
git_config_no_log: false

# Global configuration for existing users, with mandatory Git name and email.
git_user_config: []
# - user: alice
#   name: Alice Example
#   email: alice@example.org
#   config:
#     init.defaultBranch: main
#     gpg.format: ssh
#     user.signingkey: /home/alice/.ssh/id_ed25519
#     commit.gpgsign: "true"
#     tag.gpgsign: "true"
#     alias.old: null
#   no_log: false
# An inline public key is also accepted: "key::ssh-ed25519 AAAA... alice@example.org".
# config defaults to {}; no_log defaults to git_config_no_log.
