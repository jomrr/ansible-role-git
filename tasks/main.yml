---
# role: git
# file: tasks/main.yml

- name: GIT | Load platform variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __git_platform_files) }}"
  vars:
    __git_platform_files:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: GIT | Install Git and platform dependencies
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __git_packages + (__git_keyring_packages if git_keyring_enabled else []) }}"
    state: present
  register: __git_install

- name: GIT | Build the platform credential helper
  become: true
  become_user: root
  community.general.make:
    chdir: "{{ __git_keyring_helper | dirname }}"
    target: "{{ __git_keyring_helper | basename }}"
  when:
    - git_keyring_enabled
    - __git_keyring_build
    - not (ansible_check_mode and __git_install.changed)

- name: GIT | Configure system settings
  become: true
  become_user: root
  community.general.git_config:
    scope: system
    name: "{{ __git_setting.key }}"
    value: "{{ __git_setting.value }}"
    state: "{{ 'absent' if __git_setting.value is none else 'present' }}"
  loop: "{{ __git_system_settings | dict2items }}"
  loop_control:
    loop_var: __git_setting
    label: "{{ __git_setting.key }}"
  vars:
    __git_system_settings: >-
      {{ {'credential.helper': __git_keyring_helper if git_keyring_enabled and __git_keyring_supported else none}
         | combine(git_system_config) }}
  when: not (ansible_check_mode and __git_install.changed)

- name: GIT | Configure each account
  ansible.builtin.include_tasks: user.yml
  loop: "{{ git_user_config | map(attribute='user') }}"
  loop_control:
    loop_var: __git_user_name
    label: "{{ __git_user_name }}"
  vars:
    __git_user: "{{ git_user_config | selectattr('user', 'equalto', __git_user_name) | first }}"
    __git_user_settings: >-
      {{ (__git_user.config | default({}))
         | combine({'user.name': __git_user.name, 'user.email': __git_user.email}) }}
  when: not (ansible_check_mode and __git_install.changed)
