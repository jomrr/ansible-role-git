---
# role: git
# file: tasks/signing.yml

- name: GIT | Configure the explicitly supplied SSH signing key
  become: true
  become_user: "{{ __git_signer.user }}"
  community.general.git_config:
    scope: global
    name: user.signingkey
    value: "{{ __git_signer.key }}"

- name: GIT | Configure SSH signing policies
  become: true
  become_user: "{{ __git_signer.user }}"
  community.general.git_config:
    scope: global
    name: "{{ __git_signing_setting.key }}"
    value: "{{ __git_signing_setting.value }}"
  loop: "{{ __git_signing_settings | dict2items }}"
  loop_control:
    loop_var: __git_signing_setting
    label: "{{ __git_signing_setting.key }}"
  vars:
    __git_signing_settings:
      gpg.format: ssh
      commit.gpgsign: "{{ __git_signer.sign_commits | default(git_sign_commits) | string | lower }}"
      tag.gpgsign: "{{ __git_signer.sign_tags | default(git_sign_tags) | string | lower }}"
