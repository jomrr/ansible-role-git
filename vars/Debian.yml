---
# role: git
# file: vars/Debian.yml

__git_packages:
  - git
  - openssh-client
__git_keyring_packages:
  - gcc
  - libc6-dev
  - libsecret-1-dev
  - make
  - pkg-config
__git_keyring_helper: /usr/share/doc/git/contrib/credential/libsecret/git-credential-libsecret
__git_keyring_build: true
__git_keyring_supported: true
