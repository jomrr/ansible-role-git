---
# role: git
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install Git and manage system and per-user configuration, including
      SSH signing.
    options:
      git_keyring_enabled:
        type: bool
        default: true
        description:
          - Enable the libsecret credential helper on Debian, built from the sources shipped
            with Git.
      git_system_config:
        type: dict
        default:
          core.excludesfile: ~/.gitignore
          core.autocrlf: input
          core.whitespace: trailing-space,space-before-tab,tab-in-indent,cr-at-eol
          color.branch: auto
          color.diff: auto
          color.interactive: auto
          color.status: auto
          push.default: simple
          alias.a: add .
          alias.c: commit
          alias.ca: commit -a
          alias.cm: commit -m
          alias.cam: commit -am
          alias.d: diff
          alias.dc: diff --cached
          alias.l: log --graph --pretty=format:"%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr)
            %C(bold blue)<%an>%Creset" --abbrev-commit
          alias.p: push
        description:
          - Managed system Git settings, mapped from full configuration names to nonempty
            string values or null for removal.
          - Unlisted settings are preserved. Explicit credential.helper overrides the platform
            helper setting.
          - Values are public; credentials belong in per-user settings protected by no_log.
      git_config_no_log:
        type: bool
        default: false
        description:
          - Default output redaction policy for global configuration tasks.
          - Set no_log on individual accounts whose configuration contains sensitive values.
      git_user_config:
        type: list
        elements: dict
        default: []
        description:
          - Global Git configuration applied with become as each named, existing user.
          - Each account requires its Git author name and email; list each account once.
          - Unlisted settings are preserved. Git resolves the user global configuration
            file.
        options:
          user:
            type: str
            required: true
            description:
              - Existing operating-system account owning the configuration; its home directory
                must exist.
          name:
            type: str
            required: true
            description:
              - Git author name, written to user.name; takes precedence over config.
          email:
            type: str
            required: true
            description:
              - Git author email address, written to user.email; takes precedence over config.
          config:
            type: dict
            default: {}
            description:
              - Additional global Git settings, including SSH signing, using full Git configuration
                names.
              - Nonempty string values replace all values for a key; null removes all values.
                Quote booleans and numbers.
              - Setting gpg.format to ssh requires an explicit nonempty user.signingkey
                string in this mapping.
              - 'Use an explicit key path or key:: followed by a public SSH key. The key
                string is passed unchanged.'
              - The role never discovers keys. Set commit.gpgsign and tag.gpgsign explicitly
                to enable automatic signing.
          no_log:
            type: bool
            description:
              - Override git_config_no_log for this account when configuration values are
                sensitive.
